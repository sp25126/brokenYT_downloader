<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f1117;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1f2937;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      background: #064e3b;
      color: #34d399;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .card {
      background: #181d29;
      border: 1px solid #283145;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .card-desc {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      outline: none;
    }
    .progress-box {
      display: none;
      background: #111827;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .progress-bar {
      height: 6px;
      background: #374151;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.2s;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-success {
      background: #059669;
      color: white;
    }
    .btn-success:hover {
      background: #047857;
    }
    .btn-secondary {
      background: #374151;
      color: #d1d5db;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .log-box {
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      background: #090d16;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      color: #a7f3d0;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Whop Course Downloader</h2>
    <span id="connStatus" class="status-badge">Ready</span>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Select Course</span>
      <span id="courseCount" style="color: #6b7280; font-size: 11px;">Loading...</span>
    </div>
    <div class="card-desc">Choose which course from your Whop account you want to export/download.</div>
    <select id="courseSelect">
      <option value="">Fetching courses...</option>
    </select>

    <div class="btn-group">
      <button id="fetchBtn" class="btn-primary">
        ⚡ 1-Click Fetch All Videos
      </button>
    </div>
  </div>

  <div id="progressBox" class="progress-box">
    <div style="display: flex; justify-content: space-between;">
      <span id="progressText">Processing lessons...</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div id="actionBox" style="display: none;" class="card">
    <div class="card-title">Manifest Generated!</div>
    <div class="card-desc">All signed 1080p Mux video streams have been generated and paired with their exact lesson titles.</div>
    <div class="btn-group">
      <button id="downloadQueueBtn" class="btn-success">
        💾 Save queue.json
      </button>
      <button id="downloadBatBtn" class="btn-secondary">
        ⚡ Save download_all.bat
      </button>
    </div>
  </div>

  <div id="logBox" class="log-box"></div>

  <script src="popup.js"></script>
</body>
</html>
